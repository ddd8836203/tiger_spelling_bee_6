<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee 終極特訓</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- 全站常駐頂部控制列 (每個頁面皆可調字級、切換使用者與查看雲端同步) -->
    <header class="global-topbar">
        <div class="topbar-inner">
            <button type="button" class="topbar-brand" onclick="goHome()" title="回首頁">
                <span class="brand-bee">🐝</span>
                <span class="brand-title">Spelling Bee</span>
            </button>

            <div class="topbar-controls">
                <!-- 5 段字體大小切換器 (預設 1 最小) -->
                <div class="font-scale-control" role="group" aria-label="字體大小調整 (5段)">
                    <span class="fs-label">字級</span>
                    <button type="button" class="fs-btn active" data-fs-level="1" onclick="setFontScale(1)">1</button>
                    <button type="button" class="fs-btn" data-fs-level="2" onclick="setFontScale(2)">2</button>
                    <button type="button" class="fs-btn" data-fs-level="3" onclick="setFontScale(3)">3</button>
                    <button type="button" class="fs-btn" data-fs-level="4" onclick="setFontScale(4)">4</button>
                    <button type="button" class="fs-btn" data-fs-level="5" onclick="setFontScale(5)">5</button>
                </div>

                <!-- 雲端同步狀態與手動同步鈕 -->
                <button type="button" class="cloud-status-btn" id="btn-cloud-status" onclick="syncFromCloud(currentUser, true)" title="點擊立即與 Firebase 雲端同步">
                    <span class="cloud-dot" id="cloud-status-dot"></span>
                    <span id="cloud-status-text">雲端</span>
                </button>

                <!-- 使用者快速切換按鈕 -->
                <button type="button" class="nav-user-btn" id="btn-nav-user" onclick="openUserModal()" title="切換使用人員 / 雲端設定">
                    <span id="nav-user-icon">🦖</span>
                    <span id="nav-user-name">Rex</span>
                    <span class="caret">▾</span>
                </button>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- 首頁 (Home Screen) -->
        <div id="home-screen" class="screen active">
            <!-- 首頁人員快速切換膠囊列 -->
            <section class="user-switcher-bar" id="home-user-bar"></section>

            <h1 class="main-title">🐝 Spelling Bee<br><span class="highlight">特訓班</span></h1>
            
            <button onclick="openMistakeBank()" class="btn btn-danger btn-large" style="margin-bottom: 25px; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);">
                <span style="font-size: 20px;">📓 進入錯題本</span>
            </button>
            
            <div class="progress-section">
                <div class="progress-info">
                    <span>總進度</span>
                    <span id="progress-text">已掌握 0 / 100 單字</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="overall-progress"></div>
                </div>
            </div>

            <!-- 首頁 1~100 題單字答對/答錯累積熱力表 -->
            <section class="heatmap-panel" id="home-heatmap-panel">
                <div class="heatmap-header">
                    <div class="heatmap-legend">
                        <span class="leg-item"><i class="leg-dot ok"></i>綠小字=答對次數</span>
                        <span class="leg-item"><i class="leg-dot bad"></i>紅小字=答錯次數</span>
                        <span class="leg-item"><i class="leg-dot shade"></i>底色依(錯−對)變色 · 點題號直接測驗</span>
                    </div>
                </div>

                <div class="heatmap-toolbar">
                    <div class="sort-btn-group" role="group" aria-label="題號表排序方式">
                        <button type="button" class="hm-tool-btn active" data-hm-sort="id" onclick="setHeatmapSort('id')">🔢 題號順序</button>
                        <button type="button" class="hm-tool-btn" data-hm-sort="net" onclick="setHeatmapSort('net')">⚖️ 錯−對排序</button>
                        <button type="button" class="hm-tool-btn" data-hm-sort="err" onclick="setHeatmapSort('err')">🔥 僅看答錯數</button>
                    </div>
                    <button type="button" class="hm-tool-btn peek-btn" id="btn-home-peek-word" onclick="togglePeekWords()">
                        👀 偷看單字
                    </button>
                </div>

                <div class="drawer-q-grid" id="home-heatmap-grid">
                    <!-- 1~100 word badges injected here -->
                </div>
            </section>

            <div class="level-grid" id="level-grid"></div>
        </div>

        <!-- 關卡畫面 (Level Screen) -->
        <div id="level-screen" class="screen">
            <button class="back-btn" onclick="goHome()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                回首頁
            </button>
            <h2 id="level-title" class="level-title">Level 1</h2>
            
            <div class="story-controls">
                <button onclick="playFullStory()" class="btn btn-nav" id="btn-story-audio">🔊 朗讀故事</button>
                <button onclick="toggleStorySpeed()" class="btn btn-nav" id="btn-story-speed">速度：正常</button>
            </div>
            
            <div class="story-box" id="story-box">
                <!-- Story will be injected here with clickable sentences -->
            </div>

            <div class="mode-selection">
                <button onclick="startStudy()" class="btn btn-primary btn-large">
                    <span class="icon">📖</span> 單字學習模式
                </button>
                <div class="quiz-btn-group">
                    <button onclick="startQuiz('typing')" class="btn btn-danger btn-large">⌨️ 測驗(打字)</button>
                    <button onclick="startQuiz('paper')" class="btn btn-danger btn-large">📝 測驗(紙筆)</button>
                </div>
            </div>
        </div>

        <!-- 錯題本畫面 (Mistake Bank Screen) -->
        <div id="mistake-screen" class="screen">
            <div class="study-header">
                <button class="back-btn" onclick="goHome()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    回首頁
                </button>
                <h3 style="color: white; margin: 0; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);">📓 我的錯題本</h3>
            </div>
            
            <div class="mode-selection" style="margin-bottom: 20px;">
                <div class="quiz-btn-group">
                    <button onclick="startMistakeQuiz('typing')" class="btn btn-danger">⌨️ 錯題測驗(打字)</button>
                    <button onclick="startMistakeQuiz('paper')" class="btn btn-danger">📝 錯題測驗(紙筆)</button>
                </div>
            </div>

            <div class="study-list" id="mistake-list">
                <!-- Mistake words injected here -->
            </div>
        </div>

        <!-- 學習模式畫面 (List View) -->
        <div id="study-screen" class="screen">
            <div class="study-header">
                <button class="back-btn" onclick="showLevel(currentLevelIndex)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    返回
                </button>
                <h3 style="color: white; margin: 0; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);">Level <span id="study-level-num"></span></h3>
            </div>
            
            <div class="study-list" id="study-list">
                <!-- List of words injected here -->
            </div>
        </div>

        <!-- 測驗模式畫面 (Quiz Screen) -->
        <div id="quiz-screen" class="screen">
            <!-- 測驗頂部導覽列 (比照附圖：返回 + 模式/台詞開關 + 上一題 / 題號表開關 / 下一題) -->
            <div class="quiz-topbar">
                <div class="quiz-nav-left">
                    <button type="button" class="quiz-pill-btn back-pill" onclick="abortQuiz()">
                        ← 返回
                    </button>
                    <button type="button" class="quiz-pill-btn mode-pill" id="btn-quiz-mode-toggle" onclick="toggleQuizMode()" title="點擊切換紙筆或打字測驗">
                        📝 紙筆模式
                    </button>
                    <button type="button" class="quiz-pill-btn voice-pill" id="btn-quiz-anime-voice" onclick="toggleAnimeVoice()" title="切換是否朗讀動漫台詞 (預設不唸)">
                        🔇 台詞靜音
                    </button>
                </div>

                <div class="quiz-nav-right">
                    <button type="button" class="quiz-nav-arrow" id="btn-quiz-prev" onclick="prevQuizWord()">
                        ← 上一題
                    </button>
                    <button type="button" class="quiz-drawer-trigger" id="btn-quiz-drawer-toggle" onclick="toggleQuizDrawer()">
                        <span>🔢 第 <span id="quiz-counter">1 / 10</span> 題</span>
                        <span id="quiz-drawer-caret">▾</span>
                    </button>
                    <button type="button" class="quiz-nav-arrow" id="btn-quiz-next" onclick="nextQuizWord()">
                        下一題 →
                    </button>
                </div>
            </div>

            <!-- 測驗頁可展開/收合的題號累積表抽屜 -->
            <section class="heatmap-panel quiz-drawer-panel" id="quiz-drawer-panel" style="display: none;">
                <div class="heatmap-header">
                    <div class="heatmap-legend">
                        <span class="leg-item"><i class="leg-dot ok"></i>綠小字=答對次數</span>
                        <span class="leg-item"><i class="leg-dot bad"></i>紅小字=答錯次數</span>
                        <span class="leg-item"><i class="leg-dot shade"></i>底色依(錯−對)變色</span>
                    </div>
                    <button type="button" class="btn-close-drawer" onclick="toggleQuizDrawer(false)" title="收合題號表">✕</button>
                </div>

                <div class="heatmap-toolbar">
                    <div class="sort-btn-group" role="group" aria-label="測驗題號表排序方式">
                        <button type="button" class="hm-tool-btn active" data-hm-sort="id" onclick="setHeatmapSort('id', true)">🔢 題號順序</button>
                        <button type="button" class="hm-tool-btn" data-hm-sort="net" onclick="setHeatmapSort('net', true)">⚖️ 錯−對排序</button>
                        <button type="button" class="hm-tool-btn" data-hm-sort="err" onclick="setHeatmapSort('err', true)">🔥 僅看答錯數</button>
                    </div>
                    <button type="button" class="hm-tool-btn peek-btn" id="btn-quiz-peek-word" onclick="togglePeekWords()">
                        👀 偷看單字
                    </button>
                </div>

                <div class="drawer-q-grid" id="quiz-drawer-grid">
                    <!-- Quiz words grid injected here -->
                </div>
            </section>

            <div class="quiz-container">
                <div class="quiz-word-tag" id="quiz-word-id-badge">單字題號 #1</div>
                <button class="huge-audio-btn" onclick="playQuizAudio()">
                    🔊 <br>聽發音
                </button>
                
                <!-- Typing Mode Input -->
                <div class="input-group" id="quiz-typing-area">
                    <p class="hint">請拼出聽到的單字：</p>
                    <input type="text" id="quiz-input" autocomplete="off" spellcheck="false" placeholder="在此輸入拼字..." onkeypress="handleQuizKey(event)">
                    <button onclick="checkQuizTyping()" class="btn btn-primary btn-submit mt-3">送出答案</button>
                </div>

                <!-- Paper Mode Controls -->
                <div class="input-group" id="quiz-paper-area" style="display: none; width: 100%;">
                    <p class="hint">請在紙上寫下單字後，點擊下方按鈕對答案</p>
                    <button onclick="showPaperAnswer()" class="btn btn-primary btn-submit" style="width: 100%;">顯示答案</button>
                    
                    <div id="paper-answer-box" style="display: none; margin-top: 20px; width: 100%;">
                        <div id="paper-study-card-container"></div>
                        <p class="hint mt-3" style="font-weight: bold; color: white;">你寫對了嗎？</p>
                        <div style="display: flex; gap: 15px; margin-top: 15px;">
                            <button onclick="submitPaperQuiz(true)" class="btn btn-success" style="flex:1;">✔️ 我寫對了</button>
                            <button onclick="submitPaperQuiz(false)" class="btn btn-danger" style="flex:1;">❌ 我寫錯了</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 動漫回饋與單字拼讀 Overlay (無論答對或答錯皆顯示單字卡，按下一題才前進) -->
        <div id="feedback-overlay" class="overlay">
            <div class="feedback-card" id="feedback-card">
                <div class="feedback-top-bar">
                    <div class="feedback-title-group">
                        <span class="feedback-icon" id="feedback-icon">🎉</span>
                        <h2 id="feedback-title">正確！</h2>
                    </div>
                    <button type="button" class="quiz-pill-btn voice-pill off" id="btn-feedback-anime-voice" onclick="toggleAnimeVoice()" title="切換是否朗讀動漫台詞">
                        🔇 台詞靜音
                    </button>
                </div>

                <!-- 逐字母拼讀視覺列 (a - p - p - l - e 同步高亮) -->
                <div class="spelling-sequence-box" id="feedback-spelling-box">
                    <div class="spelling-letters-row" id="feedback-letters-row"></div>
                    <button type="button" class="btn-replay-spell" id="btn-replay-spelling" onclick="replayCurrentSpelling()">
                        🔤 重聽拼讀 (單字 ➔ 逐字拼 ➔ 單字)
                    </button>
                </div>

                <!-- 完整單字記憶卡 (答對與答錯一律顯示加深印象) -->
                <div class="correct-word-hint" id="correct-word-hint" style="text-align: left;">
                    <div id="feedback-study-card-container"></div>
                </div>

                <div class="anime-quote-box">
                    <p class="feedback-text" id="feedback-text">「我要成為海賊王！」</p>
                    <p class="feedback-char" id="feedback-char">— 魯夫 (海賊王)</p>
                </div>

                <button onclick="nextQuiz()" class="btn btn-primary mt-3" id="feedback-next-btn" style="width: 100%;">下一題 ➡</button>
            </div>
        </div>
        
        <canvas id="confetti"></canvas>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
